<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NeonSocial — Create Account</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

body {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 30%,
            #162a63 0%,
            #080b1a 45%,
            #02030a 100%
        );

    color: white;

}

.card {

    width: min(
        92%,
        430px
    );

    padding: 42px;

    border-radius: 28px;

    background:
        rgba(
            9,
            17,
            42,
            .85
        );

    border:
        1px solid
        rgba(
            0,
            245,
            255,
            .45
        );

    box-shadow:
        0 0 40px
        rgba(
            0,
            245,
            255,
            .15
        ),
        0 0 100px
        rgba(
            120,
            70,
            255,
            .12
        );

    backdrop-filter:
        blur(25px);

}

.logo {

    text-align: center;

    font-size: 30px;

    font-weight: bold;

    color: #00f5ff;

    margin-bottom: 8px;

}

.subtitle {

    text-align: center;

    color: #9da9cc;

    margin-bottom: 30px;

}

label {

    display: block;

    margin-bottom: 8px;

    color: #cbd5ff;

}

input {

    width: 100%;

    padding: 14px;

    margin-bottom: 20px;

    border-radius: 12px;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .12
        );

    background:
        rgba(
            0,
            0,
            0,
            .25
        );

    color: white;

    outline: none;

}

input:focus {

    border-color:
        #00f5ff;

    box-shadow:
        0 0 15px
        rgba(
            0,
            245,
            255,
            .15
        );

}

button {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 12px;

    cursor: pointer;

    font-size: 16px;

    font-weight: bold;

    color: #00151b;

    background:
        linear-gradient(
            135deg,
            #00f5ff,
            #00ff9d
        );

}

button:hover {

    transform: translateY(-1px);

}

button:disabled {

    opacity: .7;

    cursor: wait;

}

.message {

    margin-top: 18px;

    text-align: center;

    color: #ff6b9d;

}

.login {

    margin-top: 25px;

    text-align: center;

    color: #9da9cc;

}

.login a {

    color: #00f5ff;

    text-decoration: none;

}

.login a:hover {

    text-decoration: underline;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">
NEONSOCIAL AI
</div>

<div class="subtitle">
Create your account
</div>

<form id="signupForm">


<!-- ========================================================
     NAME
     ======================================================== -->

<label>
Name
</label>

<input
    id="name"
    type="text"
    placeholder="Enter your name"
    autocomplete="name"
    maxlength="100"
    required
>


<!-- ========================================================
     EMAIL
     ======================================================== -->

<label>
Email
</label>

<input
    id="email"
    type="email"
    placeholder="Enter your email"
    autocomplete="email"
    required
>


<!-- ========================================================
     PASSWORD
     ======================================================== -->

<label>
Password
</label>

<input
    id="password"
    type="password"
    placeholder="Minimum 8 characters"
    autocomplete="new-password"
    minlength="8"
    required
>


<!-- ========================================================
     CONFIRM PASSWORD
     ======================================================== -->

<label>
Confirm Password
</label>

<input
    id="confirmPassword"
    type="password"
    placeholder="Confirm your password"
    autocomplete="new-password"
    minlength="8"
    required
>


<!-- ========================================================
     CREATE ACCOUNT
     ======================================================== -->

<button
    id="signupButton"
    type="submit"
>
CREATE ACCOUNT
</button>

</form>


<!-- ========================================================
     MESSAGE
     ======================================================== -->

<div
    id="message"
    class="message"
></div>


<!-- ========================================================
     LOGIN
     ======================================================== -->

<div class="login">

Already have an account?

<a href="/login">
Login
</a>

</div>

</div>


<script>

/* ============================================================
   ELEMENTS
   ============================================================ */

const form =
    document.getElementById(
        "signupForm"
    );

const message =
    document.getElementById(
        "message"
    );

const signupButton =
    document.getElementById(
        "signupButton"
    );

const nameInput =
    document.getElementById(
        "name"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const confirmPasswordInput =
    document.getElementById(
        "confirmPassword"
    );


/* ============================================================
   SIGNUP
   ============================================================ */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /* ====================================================
           GET VALUES
           ==================================================== */

        const name =
            nameInput.value.trim();

        const email =
            emailInput.value.trim().toLowerCase();

        const password =
            passwordInput.value;

        const confirmPassword =
            confirmPasswordInput.value;


        message.textContent = "";


        /* ====================================================
           NAME VALIDATION
           ==================================================== */

        if (!name) {

            message.textContent =
                "Please enter your name.";

            nameInput.focus();

            return;

        }


        if (name.length < 2) {

            message.textContent =
                "Name must contain at least 2 characters.";

            nameInput.focus();

            return;

        }


        /* ====================================================
           EMAIL VALIDATION
           ==================================================== */

        if (!email) {

            message.textContent =
                "Please enter your email.";

            emailInput.focus();

            return;

        }


        /* ====================================================
           PASSWORD VALIDATION
           ==================================================== */

        if (!password) {

            message.textContent =
                "Please enter your password.";

            passwordInput.focus();

            return;

        }


        if (password.length < 8) {

            message.textContent =
                "Password must contain at least 8 characters.";

            passwordInput.focus();

            return;

        }


        /* ====================================================
           CONFIRM PASSWORD
           ==================================================== */

        if (!confirmPassword) {

            message.textContent =
                "Please confirm your password.";

            confirmPasswordInput.focus();

            return;

        }


        if (
            password !==
            confirmPassword
        ) {

            message.textContent =
                "Passwords do not match.";

            confirmPasswordInput.focus();

            return;

        }


        /* ====================================================
           LOADING
           ==================================================== */

        message.textContent =
            "Creating account...";

        signupButton.disabled =
            true;

        signupButton.textContent =
            "CREATING ACCOUNT...";


        /* ====================================================
           SEND TO BACKEND
           ==================================================== */

        try {

            const response =
                await fetch(
                    "/api/auth/register",
                    {

                        method: "POST",

                        credentials: "include",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                name:
                                    name,

                                email:
                                    email,

                                password:
                                    password

                            })

                    }
                );


            /* =================================================
               READ RESPONSE
               ================================================= */

            let data = {};

            try {

                data =
                    await response.json();

            }
            catch (
                jsonError
            ) {

                data = {};

            }


            /* =================================================
               ACCOUNT CREATED
               ================================================= */

            if (
                response.ok &&
                data.success === true
            ) {


                /*
                 * Save the actual user's name.
                 *
                 * Example:
                 *
                 * Laxmi  -> Laxmi
                 * Rahul  -> Rahul
                 * Suresh -> Suresh
                 */

                localStorage.setItem(
                    "neonsocial_user_name",
                    name
                );


                /*
                 * Save email too.
                 */

                localStorage.setItem(
                    "neonsocial_user_email",
                    email
                );


                /*
                 * If backend returns the
                 * actual user object, use
                 * that information.
                 */

                if (
                    data.user &&
                    typeof data.user === "object"
                ) {

                    if (
                        data.user.name
                    ) {

                        localStorage.setItem(
                            "neonsocial_user_name",
                            data.user.name
                        );

                    }

                    if (
                        data.user.email
                    ) {

                        localStorage.setItem(
                            "neonsocial_user_email",
                            data.user.email
                        );

                    }

                }


                message.textContent =
                    "Account created successfully.";


                /*
                 * Redirect to login.
                 *
                 * The user can now log in with
                 * their own email and password.
                 */

                setTimeout(
                    function() {

                        window.location.href =
                            "/login";

                    },
                    500
                );

                return;

            }


            /* =================================================
               ACCOUNT CREATION FAILED
               ================================================= */

            message.textContent =
                data.error ||
                "Unable to create account.";

            signupButton.disabled =
                false;

            signupButton.textContent =
                "CREATE ACCOUNT";

        }
        catch(error) {

            console.error(
                "Signup error:",
                error
            );

            message.textContent =
                "Unable to connect to server.";

            signupButton.disabled =
                false;

            signupButton.textContent =
                "CREATE ACCOUNT";

        }

    }
);

</script>

</body>

</html>
