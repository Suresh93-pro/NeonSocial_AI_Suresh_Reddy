<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NeonSocial — Login</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

body {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 30%,
            #162a63 0%,
            #080b1a 45%,
            #02030a 100%
        );

    color: white;

}

.card {

    width: min(
        92%,
        430px
    );

    padding: 42px;

    border-radius: 28px;

    background:
        rgba(
            9,
            17,
            42,
            .85
        );

    border:
        1px solid
        rgba(
            0,
            245,
            255,
            .45
        );

    box-shadow:
        0 0 40px
        rgba(
            0,
            245,
            255,
            .15
        ),
        0 0 100px
        rgba(
            120,
            70,
            255,
            .12
        );

    backdrop-filter:
        blur(25px);

}

.logo {

    text-align: center;

    font-size: 30px;

    font-weight: bold;

    color: #00f5ff;

    margin-bottom: 8px;

}

.subtitle {

    text-align: center;

    color: #9da9cc;

    margin-bottom: 30px;

}

label {

    display: block;

    margin-bottom: 8px;

    color: #cbd5ff;

}

input {

    width: 100%;

    padding: 14px;

    margin-bottom: 20px;

    border-radius: 12px;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .12
        );

    background:
        rgba(
            0,
            0,
            0,
            .25
        );

    color: white;

    outline: none;

}

input:focus {

    border-color:
        #00f5ff;

    box-shadow:
        0 0 15px
        rgba(
            0,
            245,
            255,
            .15
        );

}

button {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 12px;

    cursor: pointer;

    font-size: 16px;

    font-weight: bold;

    color: #00151b;

    background:
        linear-gradient(
            135deg,
            #00f5ff,
            #00ff9d
        );

}

button:hover {

    transform: translateY(-1px);

}

.message {

    margin-top: 18px;

    text-align: center;

    color: #ff6b9d;

}

.signup {

    margin-top: 25px;

    text-align: center;

    color: #9da9cc;

}

.signup a {

    color: #00f5ff;

    text-decoration: none;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">
NEONSOCIAL AI
</div>

<div class="subtitle">
AI Social Media Command Center
</div>

<form id="loginForm">

<label>
Email
</label>

<input
    id="email"
    type="email"
    placeholder="Enter your email"
    required
>

<label>
Password
</label>

<input
    id="password"
    type="password"
    placeholder="Enter your password"
    required
>

<button type="submit">
LOGIN
</button>

</form>

<div
    id="message"
    class="message"
></div>

<div class="signup">

Don't have an account?

<a href="/signup">
Create account
</a>

</div>

</div>

<script>

const form =
    document.getElementById(
        "loginForm"
    );

const message =
    document.getElementById(
        "message"
    );

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        message.textContent =
            "Logging in...";

        const email =
            document.getElementById(
                "email"
            ).value;

        const password =
            document.getElementById(
                "password"
            ).value;

        try {

            const response =
                await fetch(
                    "/api/auth/login",
                    {

                        method: "POST",
                        credentials: "include",


                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            email:
                                email,

                            password:
                                password

                        })

                    }
                );

            const data =
                await response.json();

            if (!data.success) {

                message.textContent =
                    data.error ||
                    "Login failed.";

                return;

            }

            window.location.href =
                "/";

        }
        catch(error) {

            message.textContent =
                "Unable to connect to server.";

        }

    }
);

</script>

</body>

</html>
