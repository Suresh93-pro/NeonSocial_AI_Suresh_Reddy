```html
<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NeonSocial — Login</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

body {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 30%,
            #162a63 0%,
            #080b1a 45%,
            #02030a 100%
        );

    color: white;

}

.card {

    width: min(
        92%,
        430px
    );

    padding: 42px;

    border-radius: 28px;

    background:
        rgba(
            9,
            17,
            42,
            .85
        );

    border:
        1px solid
        rgba(
            0,
            245,
            255,
            .45
        );

    box-shadow:
        0 0 40px
        rgba(
            0,
            245,
            255,
            .15
        ),
        0 0 100px
        rgba(
            120,
            70,
            255,
            .12
        );

    backdrop-filter:
        blur(25px);

}

.logo {

    text-align: center;

    font-size: 30px;

    font-weight: bold;

    color: #00f5ff;

    margin-bottom: 8px;

}

    text-align: center;

    display: block;

    margin-bottom: 8px;

    margin-bottom: 20px;

    border-radius: 12px;

    border:
        1px solid
        rgba(
            255,
            255,

        );

    background:
        rgba(
            0,
            0,
            0,
            .25
        );

    color: white;

}

input:focus {

    border-color:
        #00f5ff;

    box-shadow:
        0 0 15px
        rgba(
            0,
            245,
            255,
            .15
        );

}

button {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 12px;

    font-size: 16px;

    font-weight: bold;

        linear-gradient(
            135deg,

        );

</head>

<body>

<div class="card">

<div class="logo">
NEONSOCIAL AI
</div>

<div class="subtitle">
AI Social Media Command Center
</div>

<form id="loginForm">

<label>
Email
</label>

<input
    id="email"
    type="email"
    placeholder="Enter your email"
    autocomplete="email"
    required
>

<label>
Password
</label>

<input
    id="password"
    type="password"
    placeholder="Enter your password"
    autocomplete="current-password"
    required
>

<button
    id="loginButton"
    type="submit"
>
LOGIN
</button>

</form>

<div
    id="message"
    class="message"
></div>

<div class="signup">

Don't have an account?

<a href="/signup">
Create account
</a>

</div>

</div>

<script>

const form =
    document.getElementById(
        "loginForm"
    );

const message =
    document.getElementById(
        "message"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );


/* ============================================================
   LOGIN
   ============================================================ */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        message.textContent =
            "Logging in...";

        loginButton.disabled =
            true;

        const email =
            document.getElementById(
                "email"
            ).value.trim();

        const password =
            document.getElementById(
                "password"
            ).value;


        /* ====================================================
           VALIDATION
           ==================================================== */

        if (!email) {

            message.textContent =
                "Please enter your email.";

            loginButton.disabled =
                false;

            return;
        }


        if (!password) {

            message.textContent =
                "Please enter your password.";

            loginButton.disabled =
                false;

            return;
        }


        try {

            const response =
                await fetch(
                    "/api/auth/login",
                    {

                        method: "POST",

                        credentials: "include",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                email:
                                    email,

                                password:
                                    password

                            })

                    }
                );


            let data = {};

            try {

                data =
                    await response.json();

            }
            catch (
                jsonError
            ) {

                data = {};

            }


            /* =================================================
               LOGIN SUCCESS
               ================================================= */

            if (
                response.ok &&
                data.success === true
            ) {

                message.textContent =
                    "Login successful.";

                
                /*
                 * Save the actual logged-in user's
                 * information returned by the backend.
                 *
                 * This is NOT hardcoded to Suresh.
                 */

                if (
                    data.user &&
                    typeof data.user === "object"
                ) {

                    if (
                        data.user.name
                    ) {

                        localStorage.setItem(
                            "neonsocial_user_name",
                            data.user.name
                        );

                    }
                    else if (
                        data.user.email
                    ) {

                        localStorage.setItem(
                            "neonsocial_user_name",
                            data.user.email
                        );

                    }


                    if (
                        data.user.email
                    ) {

                        localStorage.setItem(
                            "neonsocial_user_email",
                            data.user.email
                        );

                    }

                }
                else {

                    /*
                     * Fallback.
                     * If backend doesn't return a name,
                     * use the login email.
                     */

                    localStorage.setItem(
                        "neonsocial_user_name",
                        email
                    );

                    localStorage.setItem(
                        "neonsocial_user_email",
                        email
                    );

                }


                /*
                 * Go to the main NeonSocial dashboard.
                 */

                window.location.href =
                    "/";

                return;

            }


            /* =================================================
               LOGIN FAILED
               ================================================= */

            message.textContent =
                data.error ||
                "Invalid email or password.";

            loginButton.disabled =
                false;

        }
        catch(error) {

            console.error(
                "Login error:",
                error
            );

            message.textContent =
                "Unable to connect to server.";

            loginButton.disabled =
                false;

        }

    }
);

</script>

</body>

</html>
